# FR 2052a — Server 1 存储底座
#
# 承载：
#   PostgreSQL : ADS 报表服务层 + 审计层
#   MinIO      : Iceberg 数据湖对象存储
#
# 启动：docker compose --env-file .env up -d
# 停止：docker compose --env-file .env down
# 变量：见同目录 .env.example

name: fr2052a

networks:
  fr2052a_net:
    driver: bridge

services:
  postgres:
    image: postgres:18-alpine
    container_name: fr2052a_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ}
      PGTZ: ${TZ}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      # PostgreSQL 18 起数据目录变为 /var/lib/postgresql/<major>/docker，
      # 卷必须挂在 /var/lib/postgresql。挂 /var/lib/postgresql/data 会被镜像
      # 判定为废弃挂载并拒绝启动（见 docker-library/postgres#1259）。
      - pg_data:/var/lib/postgresql
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - fr2052a_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio:
    image: ${MINIO_IMAGE}
    container_name: fr2052a_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      TZ: ${TZ}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio_data:/data
    networks:
      - fr2052a_net

  minio-init:
    image: ${MINIO_MC_IMAGE}
    container_name: fr2052a_minio_init
    restart: "no"
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
          echo "等待 MinIO 就绪 ..."
          sleep 2
        done
        mc mb -p "local/$$MINIO_BUCKET" || true
        mc anonymous set none "local/$$MINIO_BUCKET" || true
        echo "MinIO bucket ready: $$MINIO_BUCKET"
    networks:
      - fr2052a_net

volumes:
  pg_data:
  minio_data:
