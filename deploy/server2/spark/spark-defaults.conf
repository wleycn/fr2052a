# FR 2052a — Spark 全局配置（挂载到 Master 与 Worker 的 /opt/spark/conf/）
#
# 只放非敏感配置。MinIO 与 PostgreSQL 的口令不在本文件里，
# 由 spark-submit-fr2052a.sh 在提交作业时从 .env 注入，口令不入版本库。

# ---- Iceberg 扩展与 Catalog ----
# 用独立命名 catalog（lakehouse）直连 Iceberg，而不是让 Iceberg 接管 spark_catalog。
#
# 为什么不用 SparkSessionCatalog：它把命名空间交给 Spark 自身管理，命名空间不落 JDBC catalog，
# 重启会话后 SHOW NAMESPACES 只剩 default、SHOW TABLES IN <ns> 报 SCHEMA_NOT_FOUND。
# 表本身仍可按名寻址（SELECT 能跑），所以问题很隐蔽，但任何依赖目录自省的工具
# —— dbt、BI、血缘采集 —— 都会失灵。
#
# 独立 catalog 的命名空间与表都落 PostgreSQL，自省正常。未限定的 db.table 依然可直接写，
# 靠 spark.sql.defaultCatalog 兜住，不必处处加 catalog 前缀。
#
# 表元数据落 PostgreSQL（JDBC catalog），数据文件落 MinIO（S3FileIO）。
# 不用 hadoop catalog 的原因：它要求 s3a:// 协议栈，需额外引入 300MB 的 AWS SDK 包。
spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.defaultCatalog=lakehouse
spark.sql.catalog.lakehouse=org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lakehouse.type=jdbc
spark.sql.catalog.lakehouse.warehouse=s3://fr2052a-bucket/warehouse
spark.sql.catalog.lakehouse.io-impl=org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.lakehouse.s3.endpoint=http://192.168.17.22:9000
spark.sql.catalog.lakehouse.s3.path-style-access=true
# Iceberg 的 S3 区域属性名是 client.region，不是 s3.region
spark.sql.catalog.lakehouse.client.region=us-east-1

# ---- Iceberg 运行时包（挂载在 /opt/spark/fr2052a/jars）----
# 用 extraClassPath 而非 spark.jars：jar 已同时挂进 Master 与 Worker，
# 无需在两个容器之间传输上百兆的包。
spark.driver.extraClassPath=/opt/spark/fr2052a/jars/*
spark.executor.extraClassPath=/opt/spark/fr2052a/jars/*

# ---- 容器内核适配 ----
# 外挂的 JDK 17.0.1 在 cgroup v2 内核上探测容器信息会抛 NPE，
# 关掉容器感知即绕开。容器未设内存上限，不影响资源计算。
spark.driver.extraJavaOptions=-XX:-UseContainerSupport
spark.executor.extraJavaOptions=-XX:-UseContainerSupport

# ---- 演示环境收敛项 ----
spark.sql.shuffle.partitions=8
spark.ui.showConsoleProgress=false
