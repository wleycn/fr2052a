name: fr2052a
version: '1.0.0'
config-version: 2

profile: fr2052a

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
target-path: target
clean-targets:
  - target
  - dbt_packages

models:
  fr2052a:
    # 连通性自检模型，正式跑批时可 --exclude tag:smoke 排除
    smoke:
      +tags: ["smoke"]
    # staging  → OWD 层（明细标准化：汇率折算、口径归一、到期分桶）
    # intermediate → OWS 层（业务汇总：HQLA、融资、现金流）
    # marts    → ADS 层（报送报表，落 Iceberg gold 命名空间后导出 PostgreSQL）
    staging:
      +materialized: table
      +schema: silver
    intermediate:
      +materialized: table
      +schema: silver
    marts:
      +materialized: table
      +schema: gold
